name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  upload-binary:
    name: Build static binary and publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # A tag push does not auto-create a Release, and the upload action below only
      # uploads to an EXISTING release — so create it first (idempotent, with
      # auto-generated notes). Requires `contents: write`.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
                 --title "${GITHUB_REF_NAME}" --generate-notes

      # Builds `anime-tui` for the musl target (fully static: rusqlite is bundled
      # and reqwest uses rustls, so no system libs), strips it, tars it as
      # `anime-tui-x86_64-unknown-linux-musl.tar.gz`, writes a .sha256 sidecar, and
      # uploads the artifacts to the Release created above.
      - name: Build & upload
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: anime-tui
          target: x86_64-unknown-linux-musl
          archive: anime-tui-$target
          checksum: sha256
          include: LICENSE,README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Respect the committed Cargo.lock for reproducible builds.
          CARGO_BUILD_LOCKED: "true"
